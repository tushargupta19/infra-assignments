---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: config-service
  labels:
    app: config-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
        - name: config-service
          image: config-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: config-service
          env:
            # Populated by Terraform (infra/terraform/postgres.tf) once the
            # database is provisioned. `optional: true` lets the pod still
            # start (and serve via the in-memory repository) if Terraform
            # has not been applied yet, which keeps the deployment order
            # forgiving for local iteration. See README "Configuration".
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: config-service-db
                  key: DATABASE_URL
                  optional: true
          livenessProbe:
            # Liveness never touches the database: a slow/unavailable DB
            # should not cause Kubernetes to kill and restart a healthy
            # process (that would just cause a restart loop).
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # Readiness checks DB connectivity, so the pod is removed from
            # the Service's endpoints (no traffic routed to it) while the
            # database is unreachable, without killing the process.
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      securityContext:
        runAsNonRoot: true

